# Configuracion de Netlify para el sitio estatico.
#
# IMPRESCINDIBLE que este archivo exista: sin el manda la configuracion
# guardada en el panel, que dice "npm run build" y publicar "out/". Eso
# venia del Next.js anterior y aca haria fallar el despliegue, porque no
# hay nada que compilar.

[build]
  # Sin compilacion: los archivos se publican tal cual, desde la raiz.
  command = ""
  publish = "."

# ---------------------------------------------------------------------
# REDIRECCIONES
# Todas juntas aca y no en _redirects, para tener una sola fuente y que
# no se contradigan entre si.
# ---------------------------------------------------------------------

# --- rutas que se mudaron ---
[[redirects]]
  from = "/portafolio"
  to = "/trabajo/"
  status = 301

[[redirects]]
  from = "/dar.io"
  to = "/trabajo/dar-io"
  status = 301

[[redirects]]
  from = "/nexus"
  to = "/trabajo/nexuschatbot"
  status = 301

[[redirects]]
  from = "/terminos"
  to = "/legal/terminos"
  status = 301

[[redirects]]
  from = "/privacidad"
  to = "/legal/privacidad"
  status = 301

# --- alias que ya existian, repuntados al destino final ---
# El sitio anterior los mandaba a /dar.io y /nexus. Como esas rutas
# tambien cambiaron, apuntarlos ahi encadenaria un 301 hacia un 404.
[[redirects]]
  from = "/dario"
  to = "/trabajo/dar-io"
  status = 301

[[redirects]]
  from = "/nexuschatbot"
  to = "/trabajo/nexuschatbot"
  status = 301

[[redirects]]
  from = "/nexus-chatbot"
  to = "/trabajo/nexuschatbot"
  status = 301

# --- paginas retiradas: van a lo mas cercano ---
[[redirects]]
  from = "/servicios"
  to = "/#servicios"
  status = 301

[[redirects]]
  from = "/automatizaciones"
  to = "/servicios/automatizacion"
  status = 301

[[redirects]]
  from = "/nuvik-digital"
  to = "/"
  status = 301

[[redirects]]
  from = "/contacto"
  to = "/"
  status = 301

# ---------------------------------------------------------------------
# CABECERAS
# Las de seguridad se conservan tal cual venian del sitio anterior.
# ---------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los scripts y hojas llevan hash en la URL (?v=...), asi que se pueden
# cachear largo: al cambiar el archivo cambia el hash y se pide de nuevo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Imagenes y video no cambian de nombre, pero cambian poco: una semana
# con revalidacion en segundo plano.
[[headers]]
  for = "/casos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/intro/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
