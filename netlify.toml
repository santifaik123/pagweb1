# Configuracion de Netlify para el sitio estatico.
#
# IMPRESCINDIBLE que este archivo exista: sin el manda la configuracion
# guardada en el panel, que dice "npm run build" y publicar "out/". Eso
# venia del Next.js anterior y aca haria fallar el despliegue, porque no
# hay nada que compilar.

[build]
  # Un comando explicito que siempre termina bien, en vez de la cadena
  # vacia: Netlify puede tomar "" como "usa lo configurado en el panel",
  # que aqui todavia dice "npm run build" y sin package.json falla.
  command = "echo 'sitio estatico: nada que compilar'"
  publish = "."


# ---------------------------------------------------------------------
# REDIRECCIONES
# Todas juntas aca y no en _redirects, para tener una sola fuente y que
# no se contradigan entre si.
# ---------------------------------------------------------------------

# --- rutas que se mudaron ---
[[redirects]]
  from = "/portafolio"
  to = "/trabajo/"
  status = 301

[[redirects]]
  from = "/dar.io"
  to = "/trabajo/dar-io"
  status = 301

[[redirects]]
  from = "/nexus"
  to = "/trabajo/nexuschatbot"
  status = 301

[[redirects]]
  from = "/terminos"
  to = "/legal/terminos"
  status = 301

[[redirects]]
  from = "/privacidad"
  to = "/legal/privacidad"
  status = 301

# --- alias que ya existian, repuntados al destino final ---
# El sitio anterior los mandaba a /dar.io y /nexus. Como esas rutas
# tambien cambiaron, apuntarlos ahi encadenaria un 301 hacia un 404.
[[redirects]]
  from = "/dario"
  to = "/trabajo/dar-io"
  status = 301

[[redirects]]
  from = "/nexuschatbot"
  to = "/trabajo/nexuschatbot"
  status = 301

[[redirects]]
  from = "/nexus-chatbot"
  to = "/trabajo/nexuschatbot"
  status = 301

# --- paginas retiradas: van a lo mas cercano ---
[[redirects]]
  from = "/servicios"
  to = "/#servicios"
  status = 301

[[redirects]]
  from = "/automatizaciones"
  to = "/servicios/automatizacion"
  status = 301

# /nuvik-digital NO se redirige: es una pagina real otra vez. Es la pagina
# de entidad de marca, la que existe para la busqueda "nuvik" a secas, y
# Google todavia la tiene indexada con su titulo propio. Mandarla a la home
# fue lo que la saco de circulacion.

[[redirects]]
  from = "/contacto"
  to = "/"
  status = 301

# --- atajos de servicio del Next.js anterior ---
# Ahi eran redirecciones permanentes declaradas en next.config.ts. Al
# pasar al sitio estatico se quedaron fuera y hoy devuelven 404, que
# tira a la basura los enlaces que apunten a ellas.
[[redirects]]
  from = "/software-a-medida"
  to = "/servicios/software-a-medida"
  status = 301

[[redirects]]
  from = "/automatizacion"
  to = "/servicios/automatizacion"
  status = 301

[[redirects]]
  from = "/diseno-web"
  to = "/servicios/web-corporativa"
  status = 301

[[redirects]]
  from = "/inteligencia-artificial"
  to = "/servicios/agentes-ia"
  status = 301

# El sitio anterior lo mandaba a /nexus, que hoy es otra redireccion.
# Va directo al destino final para no encadenar dos saltos.
[[redirects]]
  from = "/chatbots-ia"
  to = "/trabajo/nexuschatbot"
  status = 301

# ---------------------------------------------------------------------
# CABECERAS
# Las de seguridad se conservan tal cual venian del sitio anterior.
# ---------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los scripts y hojas llevan hash en la URL (?v=...), asi que se pueden
# cachear largo: al cambiar el archivo cambia el hash y se pide de nuevo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Imagenes y video no cambian de nombre, pero cambian poco: una semana
# con revalidacion en segundo plano.
[[headers]]
  for = "/casos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Los iconos de pestana no llevan hash en el nombre, asi que se cachean
# una semana con revalidacion: si algun dia cambia la marca, el navegador
# lo repesca solo sin quedarse pegado con el viejo para siempre.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/icono-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/intro/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
